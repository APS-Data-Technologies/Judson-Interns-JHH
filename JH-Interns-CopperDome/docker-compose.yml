version: '3.9'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: copperdome_dev
      POSTGRES_USER: copperdome_user
      POSTGRES_PASSWORD: password
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: replace-me
      DEBUG: "True"
      POSTGRES_DB: copperdome_dev
      POSTGRES_USER: copperdome_user
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on:
      - db
    command: sh -c "pip install -r requirements.txt && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://host.docker.internal:8000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  db-data:
